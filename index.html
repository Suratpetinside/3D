<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Virtual Store Mockup</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Kanit', sans-serif;
        }

        body {
            background-color: #1a1a1a;
            color: #fff;
            overflow-x: hidden;
        }

        /* Top Navigation Bar */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            background: rgba(0, 0, 0, 0.8);
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
            border-bottom: 1px solid #333;
        }

        .logo {
            font-size: 20px;
            font-weight: bold;
            color: #ffcc00;
        }

        .nav-categories {
            display: flex;
            gap: 15px;
        }

        .nav-btn {
            background: #333;
            border: none;
            color: #fff;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            transition: 0.3s;
        }

        .nav-btn.active, .nav-btn:hover {
            background: #ffcc00;
            color: #000;
            font-weight: bold;
        }

        .checkout-btn {
            background: #ff4757;
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
        }

        /* Virtual Store 3D Perspective Container */
        .store-container {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1000px;
            background: linear-gradient(135deg, #2c3e50, #000);
            padding-top: 60px;
        }

        .aisle-scene {
            width: 80%;
            max-width: 1000px;
            height: 70vh;
            background: #ffeaa7;
            border-radius: 15px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            border: 5px solid #d4ac0d;
        }

        /* Floor Grid */
        .floor {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 40%;
            background: repeating-linear-gradient(45deg, #c0392b 0, #c0392b 40px, #ecf0f1 40px, #ecf0f1 80px);
            transform: rotateX(60deg);
            transform-origin: bottom;
        }

        /* Shelves */
        .shelves {
            position: absolute;
            width: 100%;
            height: 60%;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 20px;
        }

        .shelf-unit {
            background: #8e44ad;
            width: 40%;
            height: 80%;
            border-radius: 10px;
            border: 4px solid #5b2c6f;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            align-items: center;
            box-shadow: inset 0 10px 20px rgba(0,0,0,0.5);
        }

        .product-item {
            background: #fff;
            color: #333;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: transform 0.2s, background 0.2s;
        }

        .product-item:hover {
            transform: scale(1.1);
            background: #ffcc00;
        }

        /* Product Modal Popup */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }

        .modal-content {
            background: #fff;
            color: #333;
            padding: 30px;
            border-radius: 12px;
            width: 350px;
            text-align: center;
            position: relative;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .modal-content h2 {
            margin-bottom: 10px;
            color: #2c3e50;
        }

        .modal-content p {
            margin-bottom: 20px;
            color: #666;
        }

        .price {
            font-size: 22px;
            color: #e74c3c;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .buy-btn {
            background: #27ae60;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
        }

        .close-btn {
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 20px;
            cursor: pointer;
            color: #999;
        }
    </style>
</head>
<body>

    <!-- Header Menu -->
    <header>
        <div class="logo">🛒 VIRTUAL MART</div>
        <div class="nav-categories">
            <button class="nav-btn active" onclick="switchCategory('snacks')">Snacks & Sweets</button>
            <button class="nav-btn" onclick="switchCategory('drinks')">Drinks</button>
            <button class="nav-btn" onclick="switchCategory('petfood')">Pet Food</button>
        </div>
        <button class="checkout-btn">Checkout (0)</button>
    </header>

    <!-- 3D Store View -->
    <div class="store-container">
        <div class="aisle-scene">
            <div class="shelves" id="shelfArea">
                <!-- สินค้าบนชั้นจะถูกเปลี่ยนด้วย JavaScript ตามหมวดหมู่ -->
            </div>
            <div class="floor"></div>
        </div>
    </div>

    <!-- Product Detail Modal -->
    <div class="modal" id="productModal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <h2 id="modalTitle">ชื่อสินค้า</h2>
            <p id="modalDesc">รายละเอียดสินค้าจำลองเสมือนจริง</p>
            <div class="price" id="modalPrice">฿ 99</div>
            <button class="buy-btn" onclick="addToCart()">Add to Cart</button>
        </div>
    </div>

    <script>
        // ข้อมูลสินค้าจำลองตามหมวดหมู่
        const storeData = {
            snacks: [
                { name: "🍪 Cookie Crunch", desc: "คุกกี้ช็อกโกแลตชิพสูตรพิเศษ กรอบอร่อย", price: "฿ 120" },
                { name: "🍫 Taro Spicy", desc: "ปลาเส้นทาโร่รสเผ็ดแซ่บสะใจ", price: "฿ 85" },
                { name: "🍬 Jelly Joy", desc: "เยลลี่ผลไม้รวมหนпหนุบหนับ", price: "฿ 60" }
            ],
            drinks: [
                { name: "🧋 Matcha Day", desc: "ชาเขียวมัทฉะแท้จากญี่ปุ่น หอมกลมกล่อม", price: "฿ 95" },
                { name: "🥤 Soda Pop", desc: "น้ำอัดลมซ่าชื่นใจ ดับกระหาย", price: "฿ 35" }
            ],
            petfood: [
                { name: "🐱 Premium Cat Food", desc: "อาหารเม็ดพรีเมียม บำรุงขนและผิวหนัง", price: "฿ 250" },
                { name: "🐟 Creamy Treat", desc: "ขนมแมวเลียรสปลาทูน่าย่างหอมละมุน", price: "฿ 45" }
            ]
        };

        function switchCategory(category) {
            // เปลี่ยนปุ่ม Active
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            // เรนเดอร์สินค้าบนชั้นวาง
            const shelfArea = document.getElementById('shelfArea');
            shelfArea.innerHTML = '';

            const items = storeData[category];
            let html = '<div class="shelf-unit">';
            items.forEach((item, index) => {
                html += `<div class="product-item" onclick="openModal('${item.name}', '${item.desc}', '${item.price}')">${item.name}</div>`;
                if(index === 1 && items.length > 2) {
                    html += `</div><div class="shelf-unit">`;
                }
            });
            html += `</div>`;
            shelfArea.innerHTML = html;
        }

        function openModal(name, desc, price) {
            document.getElementById('modalTitle').innerText = name;
            document.getElementById('modalDesc').innerText = desc;
            document.getElementById('modalPrice').innerText = price;
            document.getElementById('productModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('productModal').style.display = 'none';
        }

        function addToCart() {
            alert('เพิ่มสินค้าลงตะกร้าเรียบร้อยแล้วครับ!');
            closeModal();
        }

        // โหลดหมวดหมู่แรกตอนเปิดเว็บ
        window.onload = () => {
            switchCategory('snacks');
        };
    </script>
</body>
</html>
